{% extends 'core/base.html' %}

{% block title %}Erro de Acesso{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center p-4">
                <h1 class="card-title text-danger">
                    <i class="bi bi-x-circle-fill"></i> Acesso Negado
                </h1>
                <p class="lead">{{ message }}</p>
                <p>Verifique se sua conta de login está autorizada a participar desta eleição.</p>
                <a href="{% url 'home' %}" class="btn btn-primary mt-3">Voltar para a Página Inicial</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
