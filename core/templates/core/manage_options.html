<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Gerenciar Opções - {{ election.title }}</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'core/style.css' %}">
</head>

<body>
    <h1>Gerenciar Opções para: {{ election.title }}</h1>

    <h2>Opções já cadastradas:</h2>
    <ul>
        {% for option in options %}
        <li>{{ option.name }}</li>
        {% empty %}
        <li>Nenhuma opção cadastrada.</li>
        {% endfor %}
    </ul>

    <h2>Adicionar Nova Opção</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Adicionar</button>
    </form>

    <p><a href="{% url 'home' %}">← Voltar</a></p>
</body>

</html>
