{% extends 'core/base.html' %}

{% block title %}Voto Já Registrado{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center p-4">
                <i class="bi bi-check-circle text-success" style="font-size: 4rem;"></i>
                <h1 class="mt-3">Seu voto já foi registrado!</h1>
                <p class="lead">Você já votou nesta eleição. Não é possível votar novamente.</p>
                <a href="{% url 'home' %}" class="btn btn-primary mt-3">Voltar para a página inicial</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
