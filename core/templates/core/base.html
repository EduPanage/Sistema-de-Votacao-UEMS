<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Votações UEMS{% endblock %}</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'core/style.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="https://www.uems.br/" target="_blank">
                <img src="{% static 'core/images/logo-uems.png' %}" alt="Logo UEMS" style="height: 38px; width: 177px;">
            </a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Conectar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Sair</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'help' %}">Ajuda</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
    <footer>
        <div class="footer-bottom py-2 text-center">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col">
                        <div class="footer-social-links mr-0 py-2 px-2">
                            <a class="social-icon-link" href="https://www.facebook.com/uemsoficial" target="_blank">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a class="social-icon-link" href="https://www.instagram.com/uemsoficial/" target="_blank">
                                <i class="fab fa-instagram"></i>
                            </a>
                            <a class="social-icon-link" href="https://www.youtube.com/@UEMSOficial" target="_blank">
                                <i class="fab fa-youtube"></i>
                            </a>
                            <a class="social-icon-link"
                                href="https://twitter.com/UEMSoficial?ref_src=twsrc%5Egoogle%7Ctwcamp%5Eserp%7Ctwgr%5Eauthor"
                                target="_blank">
                                <i class="fab fa-twitter"></i>
                            </a>
                            <a class="social-icon-link"
                                href="https://br.linkedin.com/school/universidade-estadual-de-ms" target="_blank">
                                <i class="fab fa-linkedin-in"></i>
                            </a>
                            <a class="social-icon-link" href="https://open.spotify.com/user/uemsoficial"
                                target="_blank">
                                <i class="fab fa-spotify"></i>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="row align-items-center my-3">
                    <div class="col">
                        <a href="https://www.ms.gov.br/orgao/uemsuniversidade-estadual-de-mato-grosso-do-sul150/30"
                            target="_blank">
                            <img class="w-75" src="{% static 'core/images/carta.jpg' %}" alt="Carta de Serviços">
                        </a>
                    </div>
                    <div class="col">
                        <a href="http://www.ms.gov.br/" target="_blank">
                            <img class="w-75" src="{% static 'core/images/governo.png' %}" alt="governo MS">
                        </a>
                    </div>
                    <div class="col">
                        <a href="https://emec.mec.gov.br/emec/consulta-cadastro/detalhamento/d96957f455f6405d14c6542552b0f6eb/MTAyOA=="
                            target="_blank">
                            <img class="w-100" src="{% static 'core/images/qrcode.png' %}" alt="e-mec">
                        </a>
                    </div>
                    <div class="col">
                        <a href="http://www.transparencia.ms.gov.br/" target="_blank">
                            <img class="w-75" src="{% static 'core/images/transparencia.png' %}"
                                alt="portal da transparência">
                        </a>
                    </div>
                    <div class="col">
                        <a href="https://www.cge.ms.gov.br/fique-atento-acesso-a-informacao/" target="_blank">
                            <img class="w-75" src="{% static 'core/images/acessoinformacao.png' %}"
                                alt="acesso a informação">
                        </a>
                    </div>
                    <div class="col">
                        <a href="http://www.ouvidorias.ms.gov.br/publico/Manifestacao/RegistrarManifestacao.aspx"
                            target="_blank">
                            <img class="w-75" src="{% static 'core/images/eouv.png' %}" alt="ouvidoria">
                        </a>
                    </div>
                </div>
                <div class="row align-items-center">
                    <div class="col">
                        <p class="text-white-0_5 mb-0 text-center">Copyright ©2023 UEMS. Todos os direitos
                            reservados.</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
